[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantbros-agent2"
version = "0.1.0"
description = "Agent 2: backtesting pipeline (paper → logic → data → backtest → tear sheet)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport>=0.3.0; python_version < '3.10'",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pypdf>=5.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
data = ["yfinance>=0.2.40"]

[project.scripts]
agent2 = "agent2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
