name: Tests
on:
  push:
    branches: [main, Shazil, Vlad]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.lock
      - run: python -m pip install -r requirements-core.lock
      - run: python -m pytest tests
